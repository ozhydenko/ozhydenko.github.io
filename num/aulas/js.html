<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="text/javascript" src="execjavascript.js"></script>
<title>Caixa de areia</title>
<style>
  * { box-sizing: border-box; }
  .overwrite{ position: relative; height: 0px; }
  html, body, form { width: 100%; height: 100%; margin: 0; }
  form { display: flex; flex-direction: column; }
  .panels { display: flex; flex: 1; min-height: 0; }
  textarea {
    flex: 1 1 auto;
    width: 50%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    resize: horizontal;
  }

  @media (orientation: portrait) {
    .panels { flex-direction: column; }
    textarea {
      width: 100%;
      height: 50%;
      resize: vertical;
    }
  }
</style>
</head>
<body>
<form name="main">
<!--  <div>
    <button type="button" onClick="ExecuteCodeEvent(this)">Executar</button>
    <button style="float:right" type="button" onClick="StoreText()">Salvar código</button>
  </div>-->
  <div class="overwrite"><button title="Executar código" style="float:right" type="button" onClick="ExecuteCodeEvent(this)">Executar</button></div>
  <div class="panels">
    <textarea name="code" title="Código em Javascript"></textarea>
    <textarea name="destination" title="text" readonly></textarea>
  </div>
</form>
<script>
  var GetParam=function(name){
    var results=RegExp("[\\?&]"+name.replace(/[\[]/,"\\\[").replace(/[\]]/,"\\\]")+"=([^&#]*)").exec(window.location.href)
    return results==null?"":decodeURIComponent(results[1])
  }

  var PutParam=function(name,value,tail){
    if(!tail)tail=""
    if(!value||!name || !value.length||!name.length)return tail
    return "?"+name+"="+encodeURIComponent(value)+tail.replace("?","&")
  }

  document.main.code.value=GetParam("code")

  function StoreText(){window.location.href=window.location.pathname+PutParam("code",document.main.code.value)}


  const portrait = matchMedia('(orientation: portrait)')

  portrait.addEventListener('change', () => {
    document.querySelectorAll('textarea').forEach(panel => {
      panel.style.width = portrait.matches ? '100%' : '50%'
      panel.style.height = portrait.matches ? '50%' : '100%'
    })
  })
</script>
</body>
</html>
